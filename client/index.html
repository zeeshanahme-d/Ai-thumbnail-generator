<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- The .ico is for browsers without SVG icons. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e63946" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Eyecatch AI — AI YouTube Thumbnail Generator</title>
    <meta name="description"
        content="Describe your video, pick a style and get a click-worthy YouTube thumbnail in seconds with Eyecatch AI's AI thumbnail generator." />

    <!-- Social previews. VITE_SITE_URL is the site's public origin, since these need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eyecatch AI" />
    <meta property="og:title" content="Eyecatch AI — AI YouTube Thumbnail Generator" />
    <meta property="og:description"
        content="Describe your video, pick a style and get a click-worthy YouTube thumbnail in seconds." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/hero_img.png" />
    <meta property="og:image:width" content="1840" />
    <meta property="og:image:height" content="1168" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eyecatch AI — AI YouTube Thumbnail Generator" />
    <meta name="twitter:description"
        content="Describe your video, pick a style and get a click-worthy YouTube thumbnail in seconds." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/hero_img.png" />
</head>

<body id="body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
